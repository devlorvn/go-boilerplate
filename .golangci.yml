version: "2"

run:
  timeout: 5m

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint            # errors.Is/As instead of == and type switches
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G115             # int -> int32 conversions on paging values are clamped
    revive:
      rules:
        - name: exported
          disabled: true   # doc comments on every exported name is noise here
        - name: package-comments
          disabled: true
  exclusions:
    generated: strict      # skips pkg/genproto
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, unparam, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - go-boilerplate
